name: Study Build

on:
  push:
    branches: [main]
    paths:
      - "study/**"
      - ".github/workflows/study-build.yml"
  pull_request:
    paths:
      - "study/**"
      - ".github/workflows/study-build.yml"

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install OCCT and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y             cmake             ninja-build             libocct-foundation-dev             libocct-modeling-data-dev             libocct-modeling-algorithms-dev

      - name: Configure
        run: cmake -S study -B study/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build study/build --parallel

      - name: Test
        run: ctest --test-dir study/build --output-on-failure
